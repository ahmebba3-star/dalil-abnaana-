<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0B3C49">
  <title>دليل أبنائنا بالخارج</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" hidden aria-label="رجوع"></button>
    <h1 id="title">دليل أبنائنا بالخارج</h1>
    <button class="icon-btn" id="settingsBtn" aria-label="الإعدادات"></button>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="adSlot" aria-hidden="true"></div>

  <nav class="tabbar" id="tabbar" aria-label="الأقسام"></nav>

  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/adhan.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/calls.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
