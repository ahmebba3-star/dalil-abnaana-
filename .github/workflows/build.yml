name: Build Android App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "news.json"
      - "**.md"
      - "store/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci

      - name: Arrange files (if uploaded without folders)
        run: |
          mkdir -p www/js www/css www/fonts www/vendor scripts assets store
          mvif() { if [ -f "$1" ]; then mv -f "$1" "$2"; fi; }
          for f in app.js config.js data.js i18n.js; do mvif "$f" www/js/; done
          mvif app.css www/css/
          for f in alexandria-*.woff2; do mvif "$f" www/fonts/; done
          for f in configure.js patch-android.js; do mvif "$f" scripts/; done
          for f in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do mvif "$f" assets/; done
          for f in play-icon-512.png feature-graphic-1024x500.png; do mvif "$f" store/; done
          mvif index.html www/
          if [ ! -f www/index.html ]; then
            echo "" | base64 -d > www/index.html
          fi
          ls -R www scripts assets

      - name: Add prayer-times library
        run: |
          mkdir -p www/vendor
          [ -f www/vendor/adhan.umd.min.js ] || cp node_modules/adhan/lib/bundles/adhan.umd.min.js www/vendor/

      - name: Fill app config
        env:
          ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
        run: node scripts/configure.js

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#0B3C49' --iconBackgroundColorDark '#0B3C49' --splashBackgroundColor '#0B3C49' --splashBackgroundColorDark '#0A181C'

      - name: Configure Android project
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: |
          node scripts/patch-android.js
          npx cap sync android

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "Signing key found."
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
            echo "::warning::No KEYSTORE_BASE64 secret found. Building a test APK only (no AAB for Google Play)."
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then
            ./gradlew --no-daemon bundleRelease assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Collect files
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir -p out
          if [ "$SIGNED" = "1" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "out/dalil-abnaana-v${VER}-${VERSION_CODE}.aab"
            cp android/app/build/outputs/apk/release/app-release.apk "out/dalil-abnaana-v${VER}-${VERSION_CODE}.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "out/dalil-abnaana-v${VER}-${VERSION_CODE}-test.apk"
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          ls -la out

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: dalil-abnaana-build-${{ github.run_number }}
          path: out/*

      - name: Publish release (easy download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "دليل أبنائنا بالخارج v${{ env.VER }} (build ${{ github.run_number }})"
          body: |
            - ملف `.apk`: للتجربة على الموبايل مباشرة.
            - ملف `.aab`: للرفع على Google Play Console.
            رقم الإصدار (versionCode): ${{ github.run_number }}
          files: out/*
